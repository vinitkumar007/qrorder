spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_qr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  port: 8080
  error:
    include-message: always
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
app:
  # QR ke andar yehi base URL jayega. Phone se test: http://<laptop-LAN-IP>:8080 ; production: https://tumhara-domain
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  upload-dir: ${UPLOAD_DIR:uploads}
  bootstrap:
    # Khali chhodo to random password ban ke console me ek baar print hoga
    admin-password: ${ADMIN_PASSWORD:}
    kitchen-password: ${KITCHEN_PASSWORD:}
    waiter-password: ${WAITER_PASSWORD:}
