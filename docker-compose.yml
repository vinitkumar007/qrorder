# Sirf database chahiye (PostgreSQL install nahi karna):   docker compose up -d db
# Poori app + database ek saath:                          docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hotel_qr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_qr"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hotel_qr
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      KITCHEN_PASSWORD: ${KITCHEN_PASSWORD:-}
      WAITER_PASSWORD: ${WAITER_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
